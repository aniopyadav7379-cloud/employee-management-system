<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Employee — EMS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/employee.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

<div class="app-shell" id="app-shell">
  <!-- Sidebar (same as others) -->
  <aside class="sidebar" id="sidebar">
    <a href="dashboard.html" class="sidebar-logo">
      <div class="logo-icon"><i class="fa-solid fa-users"></i></div>
      <span class="logo-text">EMS<span>Pro</span></span>
    </a>
    <nav class="sidebar-nav">
      <span class="nav-section-label">Main</span>
      <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>Dashboard</span></a>
      <a href="employees.html" class="nav-item active"><i class="fa-solid fa-users"></i><span>Employees</span></a>
      <a href="departments.html" class="nav-item"><i class="fa-solid fa-building"></i><span>Departments</span></a>
      <span class="nav-section-label">HR</span>
      <a href="leave-management.html" class="nav-item"><i class="fa-solid fa-calendar-xmark"></i><span>Leave Management</span></a>
      <span class="nav-section-label">Account</span>
      <a href="profile.html" class="nav-item"><i class="fa-solid fa-user-circle"></i><span>My Profile</span></a>
      <a href="#" class="nav-item" id="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>Sign Out</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="profile.html" class="sidebar-user">
        <div class="avatar" id="sidebar-avatar">AD</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">Admin User</div>
          <div class="user-role" id="sidebar-user-role">Administrator</div>
        </div>
      </a>
    </div>
  </aside>

  <header class="topbar">
    <button class="topbar-toggle" id="sidebar-toggle"><i class="fa-solid fa-bars"></i></button>
    <div class="topbar-breadcrumb">
      <a href="employees.html" style="color:var(--text-muted);text-decoration:none;">Employees</a>
      <i class="fa-solid fa-chevron-right"></i>
      <span class="current">Edit Employee</span>
    </div>
    <div class="topbar-actions">
      <a href="profile.html" class="topbar-avatar" id="topbar-avatar">AD</a>
    </div>
  </header>

  <main class="main-content">

    <!-- Loading state while fetching employee -->
    <div id="form-loading" style="text-align:center;padding:4rem;color:var(--text-muted);">
      <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;margin-bottom:1rem;display:block;"></i>
      Loading employee data…
    </div>

    <div id="form-container" style="display:none;">
      <div class="page-header">
        <div>
          <h1 class="page-title">Edit Employee</h1>
          <p class="page-subtitle" id="edit-page-subtitle">Loading…</p>
        </div>
        <div class="flex gap-3">
          <a href="employees.html" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</a>
          <button class="btn btn-primary" id="save-btn"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
        </div>
      </div>

      <div class="form-page-layout">
        <form id="edit-employee-form" novalidate>
          <input type="hidden" id="emp-id" />

          <!-- Personal Info -->
          <div class="card mb-6">
            <div class="card-header"><div class="card-title">Personal Information</div></div>
            <div class="card-body">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="first-name">First Name *</label>
                  <input type="text" id="first-name" class="form-control" required />
                  <div class="form-error" id="first-name-error"></div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="last-name">Last Name *</label>
                  <input type="text" id="last-name" class="form-control" required />
                  <div class="form-error" id="last-name-error"></div>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="email">Email *</label>
                  <input type="email" id="email" class="form-control" required />
                  <div class="form-error" id="email-error"></div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="phone">Phone *</label>
                  <input type="tel" id="phone" class="form-control" required />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="dob">Date of Birth</label>
                  <input type="date" id="dob" class="form-control" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="gender">Gender</label>
                  <select id="gender" class="form-select">
                    <option value="">Select gender</option>
                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>
                    <option value="OTHER">Other</option>
                    <option value="PREFER_NOT_TO_SAY">Prefer not to say</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="address">Address</label>
                <textarea id="address" class="form-control" rows="2"></textarea>
              </div>
            </div>
          </div>

          <!-- Employment -->
          <div class="card mb-6">
            <div class="card-header"><div class="card-title">Employment Details</div></div>
            <div class="card-body">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="employee-id">Employee ID *</label>
                  <input type="text" id="employee-id" class="form-control" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="department">Department *</label>
                  <select id="department" class="form-select" required>
                    <option value="">Select department</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="designation">Designation *</label>
                  <input type="text" id="designation" class="form-control" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="employment-type">Employment Type</label>
                  <select id="employment-type" class="form-select">
                    <option value="FULL_TIME">Full-time</option>
                    <option value="PART_TIME">Part-time</option>
                    <option value="CONTRACT">Contract</option>
                    <option value="INTERN">Intern</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="join-date">Join Date *</label>
                  <input type="date" id="join-date" class="form-control" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="status">Status</label>
                  <select id="status" class="form-select">
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="salary">Salary (₹)</label>
                  <input type="number" id="salary" class="form-control" min="0" step="1000" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="manager">Reporting Manager</label>
                  <select id="manager" class="form-select">
                    <option value="">No manager</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- Emergency Contact -->
          <div class="card mb-8">
            <div class="card-header"><div class="card-title">Emergency Contact</div></div>
            <div class="card-body">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="emergency-name">Contact Name</label>
                  <input type="text" id="emergency-name" class="form-control" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="emergency-phone">Emergency Phone</label>
                  <input type="tel" id="emergency-phone" class="form-control" />
                </div>
              </div>
            </div>
          </div>

          <div class="flex gap-3" style="justify-content:flex-end;margin-bottom:var(--space-8);">
            <a href="employees.html" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
          </div>
        </form>
      </div>
    </div>

  </main>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/employee.js"></script>
</body>
</html>
